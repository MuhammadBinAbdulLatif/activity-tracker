{% if results %}
<div class="space-y-2">
    {% for item in results %}
    <div class="p-2.5 rounded-lg bg-zinc-900/60 border border-zinc-800/80 flex items-center justify-between gap-3 hover:border-zinc-700 transition-colors">
        <div class="flex items-center gap-3 min-w-0">
            <img src="{{ item.poster_url }}" alt="{{ item.title }}" class="w-9 h-12 rounded object-cover border border-zinc-800 shrink-0">
            <div class="flex flex-col min-w-0">
                <span class="text-xs font-semibold text-white truncate">{{ item.title }}</span>
                <span class="text-[11px] text-zinc-400">{{ item.release_year|default:"TBA" }} &bull; ★ {{ item.vote_average|floatformat:1 }}</span>
            </div>
        </div>

        {% if item.is_tracked %}
        <span class="text-[10px] px-2 py-0.5 rounded bg-zinc-800 text-zinc-400 shrink-0">Already Tracked</span>
        {% else %}
        <form action="{% url 'movie_add' %}" method="post" class="flex items-center gap-1.5 shrink-0">
            {% csrf_token %}
            <input type="hidden" name="tmdb_id" value="{{ item.tmdb_id }}">
            <button type="submit" name="status" value="PLAN_TO_WATCH" class="px-2 py-1 bg-zinc-800 hover:bg-zinc-700 text-[11px] text-zinc-200 rounded font-medium transition-colors">
                + Watchlist
            </button>
            <button type="submit" name="status" value="COMPLETED" class="px-2 py-1 bg-emerald-950/60 hover:bg-emerald-900 border border-emerald-800 text-[11px] text-emerald-300 rounded font-medium transition-colors">
                ✓ Watched
            </button>
        </form>
        {% endif %}
    </div>
    {% endfor %}
</div>
{% else %}
<div class="text-center text-xs text-zinc-500 py-6">
    No movies found matching that query.
</div>
{% endif %}
