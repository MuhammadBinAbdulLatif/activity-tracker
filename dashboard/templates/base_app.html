{% load static %}
<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Dashboard{% endblock %} — uTrack</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- HTMX CDN -->
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            500: '#10b981',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #09090b;
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #09090b;
        }
        ::-webkit-scrollbar-thumb {
            background: #27272a;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #3f3f46;
        }
        /* Date input dialog styling */
        input[type="date"] {
            color-scheme: dark;
            cursor: pointer;
        }
        input[type="date"]::-webkit-calendar-picker-indicator {
            filter: invert(0.8);
            cursor: pointer;
            padding: 2px;
            border-radius: 4px;
        }
        input[type="date"]::-webkit-calendar-picker-indicator:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="bg-[#09090b] text-zinc-100 min-h-screen selection:bg-zinc-800 selection:text-zinc-100 flex overflow-x-hidden">

    <!-- Toast Notifications -->
    {% if messages %}
    <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2.5 max-w-sm w-full pointer-events-none px-4 sm:px-0">
        {% for message in messages %}
        <div class="toast-item pointer-events-auto flex items-start justify-between gap-3 p-3.5 rounded-xl bg-zinc-900/95 border {% if message.tags == 'error' %}border-red-900/60 text-red-200{% elif message.tags == 'success' %}border-emerald-800/60 text-emerald-200{% else %}border-zinc-800 text-zinc-200{% endif %} shadow-2xl backdrop-blur-md text-xs transition-all duration-300">
            <span class="font-medium">{{ message }}</span>
            <button onclick="this.closest('.toast-item').remove()" class="text-zinc-500 hover:text-zinc-300">&times;</button>
        </div>
        {% endfor %}
    </div>
    {% endif %}

    <!-- Sidebar Navigation Shell -->
    {% include "dashboard/sidebar.html" %}

    <!-- Main Content Area -->
    <div class="flex-1 flex flex-col min-w-0 min-h-screen pl-0 md:pl-64">
        <!-- Sticky Top Navigation / Header -->
        <header class="h-16 border-b border-zinc-800/80 bg-[#09090b]/80 backdrop-blur-md sticky top-0 z-30 px-6 sm:px-8 flex items-center justify-between">
            <div class="flex items-center gap-4">
                <button id="mobile-menu-toggle" class="md:hidden p-2 text-zinc-400 hover:text-white rounded-lg hover:bg-zinc-800/60">
                    <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
                    </svg>
                </button>
                <div class="relative hidden sm:block w-72">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-zinc-500">
                        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                        </svg>
                    </span>
                    <input type="text" placeholder="Search movies, books, habits..." class="w-full bg-zinc-900/80 border border-zinc-800/90 rounded-lg pl-9 pr-3 py-1.5 text-xs text-zinc-200 placeholder:text-zinc-500 focus:outline-none focus:border-zinc-500 focus:ring-1 focus:ring-zinc-500 transition-colors">
                </div>
            </div>

            <div class="flex items-center gap-3">
                <div class="hidden lg:flex items-center gap-2 px-3 py-1 rounded-full bg-zinc-900 border border-zinc-800 text-[11px] text-zinc-400">
                    <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                    <span>18-Day Activity Streak</span>
                </div>
                <button class="flex items-center gap-2 px-3 py-1.5 bg-zinc-100 hover:bg-white text-zinc-950 font-medium text-xs rounded-lg transition-all active:scale-[0.98] shadow-sm">
                    <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/>
                    </svg>
                    <span>Log Activity</span>
                </button>
            </div>
        </header>

        <!-- Page Body Content -->
        <main class="flex-1 p-6 sm:p-8 space-y-8 max-w-7xl w-full mx-auto">
            {% block content %}{% endblock %}
        </main>
    </div>

    <!-- Script to toggle mobile sidebar & open native date picker on date inputs -->
    <script>
        const mobileToggle = document.getElementById('mobile-menu-toggle');
        const sidebar = document.getElementById('app-sidebar');
        if (mobileToggle && sidebar) {
            mobileToggle.addEventListener('click', () => {
                sidebar.classList.toggle('-translate-x-full');
            });
        }

        // Global date picker trigger: clicking anywhere on a date input invokes the date dialog
        document.addEventListener('click', function(e) {
            if (e.target && e.target.tagName === 'INPUT' && e.target.type === 'date') {
                if (typeof e.target.showPicker === 'function') {
                    try {
                        e.target.showPicker();
                    } catch (err) {
                        // ignore if browser blocks invocation
                    }
                }
            }
        });
    </script>
</body>
</html>
