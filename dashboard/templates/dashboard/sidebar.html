{% load static %}
<aside id="app-sidebar" class="fixed inset-y-0 left-0 z-40 w-64 bg-[#09090b] border-r border-zinc-800/80 flex flex-col justify-between transition-transform duration-200 ease-in-out -translate-x-full md:translate-x-0">
    <!-- Top Branding & Navigation -->
    <div class="flex flex-col flex-1 overflow-y-auto">
        <!-- Logo / Title Header -->
        <div class="h-16 flex items-center px-6 border-b border-zinc-800/60">
            <a href="{% url 'home' %}" class="flex items-center gap-3 group">
                <img src="{% static 'accounts/branding/logo.svg' %}" alt="uTrack Logo" class="w-9 h-9 rounded-xl shadow-md border border-zinc-800 p-0.5 bg-zinc-950 transition-transform group-hover:scale-105">
                <span class="font-bold text-lg tracking-tight text-white leading-none">uTrack</span>
            </a>
        </div>

        <!-- Navigation Sections -->
        <div class="px-3 py-4 space-y-6">
            <!-- Core Section -->
            <div class="space-y-1">
                <div class="px-3 pb-1 text-[10px] font-semibold tracking-wider text-zinc-500 uppercase">
                    Core Overview
                </div>
                <a href="{% url 'home' %}" class="flex items-center gap-3 px-3 py-2 rounded-lg text-xs font-medium bg-zinc-900 border border-zinc-800 text-white shadow-sm transition-colors">
                    <svg class="w-4 h-4 text-emerald-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
                    </svg>
                    <span>Dashboard</span>
                </a>
            </div>

            <!-- Media Channels Section -->
            <div class="space-y-1">
                <div class="px-3 pb-1 text-[10px] font-semibold tracking-wider text-zinc-500 uppercase">
                    Media Categories
                </div>
                
                <!-- Movies -->
                <a href="#movies" class="flex items-center justify-between px-3 py-2 rounded-lg text-xs font-medium text-zinc-400 hover:text-zinc-100 hover:bg-zinc-900/60 transition-colors group">
                    <div class="flex items-center gap-3">
                        <svg class="w-4 h-4 text-zinc-500 group-hover:text-amber-400 transition-colors" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M7 4v16M17 4v16M3 8h4m10 0h4M3 12h18M3 16h4m10 0h4M4 20h16a1 1 0 001-1V5a1 1 0 00-1-1H4a1 1 0 00-1 1v14a1 1 0 001 1z"/>
                        </svg>
                        <span>Movies</span>
                    </div>
                    <span class="text-[10px] px-1.5 py-0.5 rounded bg-zinc-800/60 text-zinc-400">1 Active</span>
                </a>

                <!-- Series -->
                <a href="#series" class="flex items-center justify-between px-3 py-2 rounded-lg text-xs font-medium text-zinc-400 hover:text-zinc-100 hover:bg-zinc-900/60 transition-colors group">
                    <div class="flex items-center gap-3">
                        <svg class="w-4 h-4 text-zinc-500 group-hover:text-indigo-400 transition-colors" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
                        </svg>
                        <span>Series & TV</span>
                    </div>
                    <span class="text-[10px] px-1.5 py-0.5 rounded bg-zinc-800/60 text-zinc-400">Ep 5</span>
                </a>

                <!-- Books -->
                <a href="#books" class="flex items-center justify-between px-3 py-2 rounded-lg text-xs font-medium text-zinc-400 hover:text-zinc-100 hover:bg-zinc-900/60 transition-colors group">
                    <div class="flex items-center gap-3">
                        <svg class="w-4 h-4 text-zinc-500 group-hover:text-emerald-400 transition-colors" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/>
                        </svg>
                        <span>Books</span>
                    </div>
                    <span class="text-[10px] px-1.5 py-0.5 rounded bg-zinc-800/60 text-zinc-400">63%</span>
                </a>

                <!-- Audiobooks -->
                <a href="#audiobooks" class="flex items-center justify-between px-3 py-2 rounded-lg text-xs font-medium text-zinc-400 hover:text-zinc-100 hover:bg-zinc-900/60 transition-colors group">
                    <div class="flex items-center gap-3">
                        <svg class="w-4 h-4 text-zinc-500 group-hover:text-violet-400 transition-colors" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 100-6 3 3 0 000 6z"/>
                        </svg>
                        <span>Audiobooks</span>
                    </div>
                    <span class="text-[10px] px-1.5 py-0.5 rounded bg-zinc-800/60 text-zinc-400">1.2x</span>
                </a>

                <!-- Comics & Manga -->
                <a href="#comics" class="flex items-center justify-between px-3 py-2 rounded-lg text-xs font-medium text-zinc-400 hover:text-zinc-100 hover:bg-zinc-900/60 transition-colors group">
                    <div class="flex items-center gap-3">
                        <svg class="w-4 h-4 text-zinc-500 group-hover:text-rose-400 transition-colors" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z"/>
                        </svg>
                        <span>Comics & Manga</span>
                    </div>
                    <span class="text-[10px] px-1.5 py-0.5 rounded bg-zinc-800/60 text-zinc-400">Vol 7</span>
                </a>

                <!-- Exercises & Life Habits -->
                <a href="#exercises" class="flex items-center justify-between px-3 py-2 rounded-lg text-xs font-medium text-zinc-400 hover:text-zinc-100 hover:bg-zinc-900/60 transition-colors group">
                    <div class="flex items-center gap-3">
                        <svg class="w-4 h-4 text-zinc-500 group-hover:text-teal-400 transition-colors" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z"/>
                        </svg>
                        <span>Exercises & Habits</span>
                    </div>
                    <span class="text-[10px] px-1.5 py-0.5 rounded bg-teal-500/10 text-teal-400 border border-teal-500/20">3/4</span>
                </a>
            </div>
        </div>
    </div>

    <!-- Small Breaker / Divider Line -->
    <div class="px-4">
        <div class="border-t border-zinc-800/80"></div>
    </div>

    <!-- User Profile & Settings Section -->
    <div class="p-3">
        <div class="p-2.5 rounded-xl bg-zinc-950 border border-zinc-800/90 flex flex-col gap-3">
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-2.5 min-w-0">
                    <div class="w-8 h-8 rounded-lg bg-zinc-800 border border-zinc-700/60 flex items-center justify-center text-xs font-bold text-zinc-200 shrink-0">
                        {{ user.username|slice:":1"|upper }}
                    </div>
                    <div class="flex flex-col min-w-0">
                        <span class="text-xs font-semibold text-zinc-100 truncate">{{ user.username }}</span>
                        <span class="text-[10px] text-zinc-500 truncate">Pro Chronicle</span>
                    </div>
                </div>
                <a href="#settings" title="Settings" class="p-1 text-zinc-400 hover:text-zinc-200 hover:bg-zinc-800/60 rounded-lg transition-colors">
                    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                    </svg>
                </a>
            </div>

            <div class="flex items-center gap-1.5 pt-1 border-t border-zinc-900">
                <a href="#settings" class="flex-1 text-center py-1 rounded-md text-[11px] font-medium text-zinc-400 hover:text-zinc-200 hover:bg-zinc-900 transition-colors">
                    Settings
                </a>
                <form action="{% url 'logout' %}" method="post" class="flex-1">
                    {% csrf_token %}
                    <button type="submit" class="w-full text-center py-1 rounded-md text-[11px] font-medium text-red-400/80 hover:text-red-300 hover:bg-red-950/30 transition-colors">
                        Sign Out
                    </button>
                </form>
            </div>
        </div>
    </div>
</aside>
